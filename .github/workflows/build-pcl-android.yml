name: Build PCL Android ARM64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repository (PCL patch)
        uses: actions/checkout@v4

      - name: Locate and extract PCL patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_ZIP="$(find "$GITHUB_WORKSPACE" -type f -name 'PCL_Android_Port_0.7.0-dev_source_patch*.zip' -print -quit)"
          if [[ -z "$PATCH_ZIP" ]]; then
            echo '::error::Patch ZIP not found. Upload the PCL patch ZIP to the repository root.'
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pcl-patch"
          unzip -q "$PATCH_ZIP" -d "$RUNNER_TEMP/pcl-patch"
          PATCH_DIR="$(find "$RUNNER_TEMP/pcl-patch" -mindepth 1 -maxdepth 1 -type d -name 'PCL_Android_Port_*' -print -quit)"
          if [[ -z "$PATCH_DIR" || ! -f "$PATCH_DIR/apply.sh" ]]; then
            echo '::error::Patch archive structure is invalid: apply.sh not found.'
            find "$RUNNER_TEMP/pcl-patch" -maxdepth 4 -type f -print
            exit 1
          fi
          echo "PATCH_DIR=$PATCH_DIR" >> "$GITHUB_ENV"

      - name: Checkout Fold Craft Launcher source
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/FoldCraftLauncher
          ref: main
          path: FCL-source

      - name: Apply PCL overlay
        shell: bash
        run: bash "$PATCH_DIR/apply.sh" "$GITHUB_WORKSPACE/FCL-source"

      - name: Configure PCL build variant fallback
        working-directory: FCL-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("FCL/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          needle = 'create("pclDev") {'
          if needle not in s:
              raise SystemExit('Could not find create("pclDev") in FCL/build.gradle.kts; no files were changed.')
          insertion = needle + '\n            matchingFallbacks += listOf("fordebug", "debug", "release")'
          s = s.replace(needle, insertion, 1)
          p.write_text(s, encoding="utf-8")
          print("Added pclDev matchingFallbacks: fordebug, debug, release")
          PY

      - name: Fix Android library Kotlin variant attributes
        working-directory: FCL-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          modules = ("ZipFileSystem", "Terracotta")
          needle = "plugins { alias(libs.plugins.android.library) }"
          replacement = "plugins {\n    alias(libs.plugins.android.library)\n    alias(libs.plugins.kotlin.android)\n}"
          for module in modules:
              path = Path(module) / "build.gradle.kts"
              source = path.read_text(encoding="utf-8")
              if "alias(libs.plugins.kotlin.android)" in source or 'id("org.jetbrains.kotlin.android")' in source:
                  print(f"{module}: Kotlin Android plugin already present")
                  continue
              if needle not in source:
                  raise SystemExit(f"Cannot safely patch {path}: expected plugin declaration not found")
              path.write_text(source.replace(needle, replacement, 1), encoding="utf-8")
              print(f"{module}: added Kotlin Android plugin for androidJvm variant attribute")
          PYCODE

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Build ARM64 APK
        working-directory: FCL-source
        run: |
          chmod +x ./gradlew
          ./gradlew :FCL:assemblePclDev -Darch=arm64 --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-Android-ARM64-APK
          path: FCL-source/FCL/build/outputs/apk/pclDev/**/*.apk
          if-no-files-found: error
          retention-days: 14
